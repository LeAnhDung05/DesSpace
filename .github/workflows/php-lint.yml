name: PHP lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint DeSpace PHP files
        run: |
          find wordpress/wp-content/plugins/despace-core wordpress/wp-content/themes/despace-child -name '*.php' -print0 | xargs -0 -n1 php -l
