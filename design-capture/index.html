<template id="p-faq"><div class="wrap" style="max-width:940px"><div class="crumb">Trang chủ　/　Hỗ trợ</div><div class="eyebrow">HELP CENTER</div><h1 class="title serif">Câu hỏi thường gặp</h1><p class="muted">Thông tin về sản phẩm, đặt hàng, giao hàng và bảo hành.</p><div class="tabs"><span class="sel">Đặt hàng</span><span>Giao hàng</span><span>Thanh toán</span><span>Bảo hành</span></div><div class="filtergroup"><h4>Làm thế nào để đặt mua sản phẩm?</h4><p class="muted small">Chọn sản phẩm, cấu hình biến thể và thêm vào giỏ hàng. Tại checkout, điền thông tin nhận hàng, lựa chọn vận chuyển và thanh toán để hoàn tất đơn.</p></div><div class="filtergroup"><h4>Tôi có thể thay đổi đơn hàng sau khi đặt không?</h4><p class="muted small">Liên hệ bộ phận chăm sóc khách hàng sớm nhất. Khả năng thay đổi phụ thuộc trạng thái xử lý của đơn hàng.</p></div><div class="filtergroup"><h4>DeSpace giao hàng trong bao lâu?</h4><p class="muted small">Thời gian dự kiến hiển thị theo khu vực giao hàng tại bước thanh toán; nhân viên sẽ xác nhận trước khi giao.</p></div><div class="filtergroup"><h4>Phí lắp đặt được tính như thế nào?</h4><p class="muted small">Phí và điều kiện lắp đặt phụ thuộc sản phẩm, địa chỉ và phương thức vận chuyển được cấu hình.</p></div><div class="filtergroup"><h4>Tôi có thể thanh toán bằng cách nào?</h4><p class="muted small">COD và chuyển khoản thủ công khi cửa hàng đã cấu hình; trạng thái thanh toán sẽ được cập nhật sau xác nhận.</p></div><div class="filtergroup"><h4>Chính sách bảo hành áp dụng ra sao?</h4><p class="muted small">Thời hạn và phạm vi bảo hành được ghi theo từng sản phẩm và chứng từ mua hàng.</p></div></div></template>
<template id="p-policy"><div class="wrap" style="max-width:940px"><div class="crumb">Trang chủ　/　Chính sách</div><div class="eyebrow">CUSTOMER CARE</div><h1 class="title serif">Chính sách mua hàng</h1><p class="muted">Thông tin minh bạch để bạn an tâm trong suốt hành trình cùng DeSpace.</p><div class="tabs"><span class="sel">Giao hàng</span><span>Đổi trả</span><span>Bảo hành</span><span>Bảo mật</span></div><article class="filtergroup"><h2 class="serif" style="font-size:25px">01. Giao hàng & lắp đặt</h2><p class="muted">Phạm vi, thời gian và phí giao hàng được hiển thị theo địa chỉ nhận hàng tại checkout. Với sản phẩm cồng kềnh, nhân viên xác nhận lịch giao và phương án lắp đặt.</p></article><article class="filtergroup"><h2 class="serif" style="font-size:25px">02. Đổi trả</h2><p class="muted">Điều kiện đổi trả cần được xác nhận theo chính sách bán hàng chính thức. Khách hàng vui lòng kiểm tra sản phẩm khi nhận và liên hệ bộ phận hỗ trợ nếu phát hiện vấn đề.</p></article><article class="filtergroup"><h2 class="serif" style="font-size:25px">03. Bảo hành</h2><p class="muted">Thời hạn và phạm vi bảo hành phụ thuộc từng dòng sản phẩm, được ghi cụ thể trong thông tin sản phẩm và chứng từ mua hàng.</p></article><article class="filtergroup"><h2 class="serif" style="font-size:25px">04. Bảo mật thông tin</h2><p class="muted">Thông tin khách hàng được dùng để xử lý đơn hàng, chăm sóc và cung cấp dịch vụ liên quan theo chính sách bảo mật cửa hàng.</p></article></div></template>
